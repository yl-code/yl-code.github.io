<head>
  <meta charset="UTF-8">

  <title>games</title>
  <style>
    @view-transition { navigation: auto; }
    :root {
      color-scheme: dark;
      --bg: #000;
      --ink: #ececec;
      --dim: #737373;
      --line: #2a2a2a;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    body {
      position: relative;
      height: 100dvh;
      max-width: 430px;
      margin: 0 auto;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    .mark, .bar {
      position: absolute;
      z-index: 3;
      pointer-events: none;
    }
    .mark {
      top: env(safe-area-inset-top);
      left: 24px;
      height: 40px;
      line-height: 40px;
      color: var(--ink);
      font-size: 12px;
      letter-spacing: 0.16em;
      white-space: pre;
      opacity: 0;
      view-transition-name: path;
    }
    .mark span { color: var(--dim); }
    .mark::after {
      content: '_';
      animation: caret 1.1s steps(1) infinite;
    }
    @keyframes caret {
      50% { opacity: 0; }
    }
    .bar {
      top: 0;
      left: 0;
      width: 100%;
      height: 1px;
      background: var(--ink);
      transform: scaleX(0);
      transform-origin: left center;
    }
    .fx {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 4;
      pointer-events: none;
      opacity: 0;
    }
    .deck {
      height: 100%;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      overscroll-behavior-y: contain;
      scrollbar-width: none;
      touch-action: pan-y;
    }
    .deck::-webkit-scrollbar { display: none; }
    .slide {
      position: relative;
      height: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
    }

    .home {
      display: flex;
      flex-direction: column;
      padding: calc(54px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom));
    }
    .rows {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-top: 1px solid rgba(42, 42, 42, var(--chrome, 0));
      opacity: var(--ui, 0);
    }
    .row {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      gap: 22px;
      border-bottom: 1px solid rgba(42, 42, 42, var(--chrome, 0));
      color: inherit;
      text-decoration: none;
    }
    .home.dom .rows { border-top-color: var(--line); }
    .home.dom .row { border-bottom-color: var(--line); }
    .slide.dom .rows,
    .slide.dom .stage { opacity: 1; }
    .plate {
      width: 96px;
      height: 96px;
      flex: none;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
    }
    .plate svg, .icon {
      width: 64px;
      height: 64px;
      stroke: var(--ink);
      fill: none;
      stroke-width: 1.15;
      stroke-linejoin: miter;
    }
    .idx {
      display: block;
      margin-bottom: 8px;
      color: var(--dim);
      font-size: 11px;
      letter-spacing: 0.18em;
    }
    strong {
      display: block;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.28em;
    }
    em {
      display: block;
      margin-top: 8px;
      font-style: normal;
      color: var(--dim);
      font-size: 11px;
      letter-spacing: 0.2em;
    }

    .stage {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: inherit;
      text-decoration: none;
      opacity: var(--ui, 0);
    }
    .stage .plate { position: relative; width: 120px; height: 120px; }
    .stage .icon { width: 78px; height: 78px; }
    .stage strong { font-size: 18px; letter-spacing: 0.32em; }
    .aim {
      --c: rgba(236, 236, 236, 0.86);
      position: absolute;
      inset: -11px;
      opacity: 0;
      pointer-events: none;
      background:
        linear-gradient(var(--c), var(--c)) left top / 10px 1px no-repeat,
        linear-gradient(var(--c), var(--c)) left top / 1px 10px no-repeat,
        linear-gradient(var(--c), var(--c)) right top / 10px 1px no-repeat,
        linear-gradient(var(--c), var(--c)) right top / 1px 10px no-repeat,
        linear-gradient(var(--c), var(--c)) left bottom / 10px 1px no-repeat,
        linear-gradient(var(--c), var(--c)) left bottom / 1px 10px no-repeat,
        linear-gradient(var(--c), var(--c)) right bottom / 10px 1px no-repeat,
        linear-gradient(var(--c), var(--c)) right bottom / 1px 10px no-repeat;
    }
    @media (prefers-reduced-motion: reduce) {
      .mark::after { animation: none; }
    }
  </style>
</head>

      function prepBoot() {

            boot.tz0[n] = lanes[k] + (unit(n * 7.7 + 3.4) - 0.5) * 0.024;

            boot.tz0[n] = unit(n * 7.7 + 3.4);
            boot.tsp[n] = 0.65 + 0.7 * unit(n * 3.3 + 0.9);
            boot.tbn[n] = 0.35 + 0.45 * unit(n * 4.1 + 1.6);

          boot.tact[n] = 20 + 700 * Math.pow(unit(n * 6.1 + 2.8), 0.7);
          d = travel(boot.tact[n]) * boot.tsp[n] + boot.tz0[n];

      function ghostKick(env, elapsed, height) {
        var step, a, b, big;
        if (env < 0.02) return null;
        step = (elapsed / 28) | 0;
        a = unit(step * 1.3);
        b = unit(step * 2.1 + 5);
        big = a > 0.82;
        return {
          x: (b - 0.5) * (big ? 14 : 3.5) * env,
          y: (unit(step + 8) - 0.5) * 1.6 * env,
          flick: big && env > 0.35 ? 0.72 : 1,
          env: env,
          slice: big && env > 0.4 ? unit(step + 6) * height : -1
        };
      }

      function settleShake(t, elapsed, height) {

        env = t < 0.78 ? smoothstep((t - 0.64) / 0.14) : Math.pow(clamp01(1 - (t - 0.78) / 0.22), 1.45);
        return ghostKick(env, elapsed, height);
      }

      function setBootUi(ui) {

        home.style.setProperty('--ui', String(v));
        home.style.setProperty('--chrome', String(v));
        markEl.style.opacity = String(v);
      }

      function setRowsShift(x, y) {
        var v = x || y ? 'translate3d(' + x.toFixed(2) + 'px,' + y.toFixed(2) + 'px,0)' : '';
        if (v === rowsShift) return;
        rowsShift = v;
        rowsEl.style.transform = v;
      }

      function renderBoot(elapsed) {
        var f = fields[0];
        var tx = f.tx;
        var ty = f.ty;
        var amp = f.amp;
        var glitch = null;
        var cx = boot.cx;
        var cy = boot.cy;
        var tau = elapsed - BOOT.burst;
        var t, ui, dustOp, k, a, x, y, arrive, dissolve, len, sh;
        if (elapsed < BOOT.gatherAt) {
          t = 0;
          ui = 0;
          dustOp = 1;
        } else {
          t = clamp01((elapsed - BOOT.gatherAt) / BOOT.gatherMs);
          glitch = settleShake(t, elapsed, viewH);
          ui = smoothstep((t - 0.42) / 0.28);
          if (glitch && glitch.flick < 1) ui *= glitch.flick;
          dustOp = t < 0.78 ? 1 : 1 - smoothstep((t - 0.78) / 0.18);
        }
        setRowsShift(glitch ? glitch.x * 0.5 : 0, glitch ? glitch.y : 0);

        wipe();
        if (tau > 0 && tau < 640) {
          sh = 4.6 * Math.exp(-tau / 150);
          cx += sh * (0.6 * Math.sin(tau * 0.23) + 0.4 * Math.sin(tau * 0.57 + 1.3));

        g.globalCompositeOperation = 'source-over';
        g.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (elapsed >= BOOT.gatherAt) {
          arrive = smoothstep(t / 0.72);
          if (arrive < 0.9) {
            len = 6 * (1 - arrive / 0.9);
            for (k = 0; k < f.count; k++) {
              a = amp[k] * dissolve;
              if (a < 0.03) continue;
              mote(boot.ox[k] + (tx[k] - boot.ox[k]) * arrive, boot.oy[k] + (ty[k] - boot.oy[k]) * arrive, boot.ux[k], boot.uy[k], a, len);
            }
            g.setTransform(dpr, 0, 0, dpr, 0, 0);
          } else if (arrive < 1) {
            for (k = 0; k < f.count; k++) {
              a = amp[k] * dissolve;
              if (a < 0.03) continue;
              x = boot.ox[k] + (tx[k] - boot.ox[k]) * arrive;
              y = boot.oy[k] + (ty[k] - boot.oy[k]) * arrive;
              if (glitch) {
                g.globalAlpha = a * 0.5 * glitch.env;
                g.fillRect(x + glitch.x, y + glitch.y * 0.35, 1, 1);
                x += glitch.x * 0.5;
                y += glitch.y;
              }
              g.globalAlpha = a;
              g.fillRect(x, y, 1, 1);
            }
          } else {
            if (glitch) drawGroups(f, glitch.x, glitch.y * 0.35, 0.5 * glitch.env, -1);
            drawGroups(f, glitch ? glitch.x * 0.5 : 0, glitch ? glitch.y : 0, 1, -1);
          }
          if (glitch && glitch.slice >= 0) {
            g.globalAlpha = 0.55 * glitch.env;
            g.fillRect(0, glitch.slice, viewW, 1);
          }
        }
        g.globalAlpha = 1;

      function bootFrame(now) {

        }

        bootRaf = requestAnimationFrame(bootFrame);

      function finishBoot() {
        var k;

        bootRaf = 0;
        boot = null;
        setRowsShift(0, 0);

      function setSlideFade(index, o) {
        var body = bodies[index];
        var v = o >= 0.985 ? 1 : o <= 0.02 ? 0 : Math.round(o * 1000) / 1000;
        if (shownFade[index] === v) return;
        shownFade[index] = v;
        slides[index].classList.add('dom');
        body.style.opacity = v === 1 ? '' : String(v);
        body.style.visibility = v === 0 ? 'hidden' : '';
        if (v === 0 && aimAnims[index]) {
          aimAnims[index].cancel();
          aimAnims[index] = null;
        }
      }

      function setBar(v) {
        var r = Math.round(v * 10000) / 10000;
        if (r === barShown) return;
        barShown = r;
        bar.style.transform = 'scaleX(' + r + ')';
      }

      function markFrame() {
        var k = (performance.now() - mark.start) / 300;
        var target = mark.target;
        var step, reveal, out, c;
        mark.raf = 0;
        if (k >= 1) {
          markText.nodeValue = target;
          return;
        }
        step = (k * 300 / 34) | 0;
        if (step !== mark.step) {
          mark.step = step;
          reveal = Math.floor(target.length * clamp01((k - 0.25) / 0.75));
          out = target.slice(0, reveal);
          for (c = reveal; c < target.length; c++) out += GLYPHS.charAt((unit(step * 7.3 + c * 1.9) * GLYPHS.length) | 0);
          markText.nodeValue = out;
        }
        mark.raf = requestAnimationFrame(markFrame);
      }

      function setMarkText(text) {
        if (text === mark.target) return;
        mark.target = text;
        if (!motion) {
          markText.nodeValue = text;
          return;
        }
        mark.start = performance.now();
        mark.step = -1;
        if (!mark.raf) mark.raf = requestAnimationFrame(markFrame);
      }

      function stopLock() {
        var idx = lock.index;
        lock.on = false;
        if (lock.raf) cancelAnimationFrame(lock.raf);
        lock.raf = 0;
        if (lock.body) {
          lock.body.style.transform = '';
          lock.body.style.opacity = shownFade[idx] === 1 ? '' : String(shownFade[idx]);
          lock.body = null;
        }
        clearFx();
      }

      function lockFrame() {
        var now = performance.now();
        var k = (now - lock.from) / 560;
        var F = fields[lock.index];
        var env, kick;
        lock.raf = 0;
        if (!lock.on) return;
        if (k >= 1) {
          stopLock();
          return;
        }
        env = k < 0.22 ? smoothstep(k / 0.22) : Math.pow(clamp01(1 - (k - 0.22) / 0.78), 1.45);
        kick = ghostKick(env, now, viewH);
        if (lock.body && kick) {
          lock.body.style.transform = 'translate3d(' + (kick.x * 0.5).toFixed(2) + 'px,' + kick.y.toFixed(2) + 'px,0)';
          lock.body.style.opacity = String(kick.flick);
        }
        wipe();
        if (F && kick) {
          drawGroups(F, kick.x, kick.y * 0.35, 0.5 * kick.env, -1);
          if (kick.slice >= 0) {
            g.globalAlpha = 0.55 * kick.env;
            g.fillRect(0, kick.slice, viewW, 1);
          }
          g.globalAlpha = 1;
          setFxAlpha(1);
        } else {
          setFxAlpha(0);
        }
        lock.raf = requestAnimationFrame(lockFrame);
      }

      function lockOn(index) {
        stopLock();
        lock.on = true;
        lock.index = index;
        lock.from = performance.now();
        lock.body = bodies[index];
        if (aims[index] && aims[index].animate) {
          if (aimAnims[index]) aimAnims[index].cancel();
          aimAnims[index] = aims[index].animate(AIM_KEYS, AIM_OPTS);
        }
        lock.raf = requestAnimationFrame(lockFrame);
      }

      function renderWarp(tau, appear) {
        var W = warp;
        var F = fields[W.slide];
        var cx = W.cx;
        var cy = W.cy;
        var out = W.dir > 0;
        var k, id, s, e, r, x, y, al, len, rest, core, u, fw;
        wipe();
        rest = (1 - smoothstep(tau / 0.3)) * appear;
        if (W.others.length) drawGroups(F, 0, 0, rest, W.game);
        for (k = 0; k < W.n; k++) {
          id = W.list[k];
          s = clamp01((tau - W.lag[k] * 0.24) / 0.6);
          if (s >= 1) continue;
          e = s * s * s;
          r = W.dist[k] * (1 - e) + (s < 0.3 ? Math.sin(s / 0.3 * Math.PI) * 3 : 0);
          x = cx + W.ux[k] * r;
          y = cy + W.uy[k] * r;
          al = F.amp[id];
          al += (1 - al) * Math.min(1, e * 4) * 0.6;
          al *= appear * (1 - smoothstep((s - 0.82) / 0.18));
          if (al < 0.02) continue;
          len = Math.min(18, 0.2 * s * s * W.dist[k] * W.speed);
          if (out) mote(x, y, -W.ux[k], -W.uy[k], al, len);
          else mote(x, y, W.ux[k], W.uy[k], al, len);
        }
        g.setTransform(dpr, 0, 0, dpr, 0, 0);
        core = smoothstep((tau - 0.5) / 0.28);
        u = clamp01((tau - 0.8) / 0.2);
        if (u > 0) {
          core *= 1 - smoothstep(u);
          fw = 72 * Math.sin(Math.PI * u);
          if (fw > 0.5) {
            g.globalAlpha = 0.85 * Math.sin(Math.PI * u);
            ramp(streakSprite, streakH, cx + 0.5, cy + 0.5, 1, 0, fw);
            ramp(streakSprite, streakH, cx + 0.5, cy + 0.5, -1, 0, fw);
            g.setTransform(dpr, 0, 0, dpr, 0, 0);
          }
        }
        drawCore(cx, cy, core);
        g.globalAlpha = 1;
      }

      function warpFrame(now) {
        var W = warp;
        var el, k, tau;
        if (!W) return;
        W.raf = 0;
        el = now - W.from;
        if (el < 0) el = 0;
        if (W.dir > 0) {
          k = smoothstep(el / 90);
          setSlideFade(W.slide, 1 - k);
          tau = clamp01(el / W.dur);
          renderWarp(tau, k);
          if (tau >= 1) {
            warp = null;
            clearFx();
            leaving = { slide: W.slide, game: W.game };
            setTimeout(function () {
              if (leaving && !document.hidden) {
                var back = leaving;
                leaving = null;
                startWarp(-1, back.slide, back.game);
              }
            }, 2500);
            location.href = W.href;
            return;
          }
        } else if (el < W.dur) {
          renderWarp(1 - el / W.dur, 1);
        } else {
          if (!W.landed) {
            W.landed = true;
            renderWarp(0, 1);
          }
          k = clamp01((el - W.dur) / 180);
          setSlideFade(W.slide, k);
          setFxAlpha(1 - k);
          if (k >= 1) {
            warp = null;
            clearFx();
            lockOn(W.slide);
            return;
          }
        }
        W.raf = requestAnimationFrame(warpFrame);
      }

      function startWarp(dir, slide, game, href) {
        var F = fields[slide];
        var list = F && F.groups[game];
        var others = [];
        var c, n, k, id, dx, dy, d, W;
        if (!list || !list.length) {
          if (href) location.href = href;
          else setSlideFade(slide, 1);
          return;
        }
        for (k = 0; k < F.games.length; k++) if (F.games[k] !== game) others.push(F.games[k]);
        c = F.cent[game * 5] || F.cent[game * 5 + 1];
        n = list.length;
        W = {
          dir: dir,
          slide: slide,
          game: game,
          href: href,
          list: list,
          others: others,
          n: n,
          cx: c[0],
          cy: c[1],
          ux: new Float32Array(n),
          uy: new Float32Array(n),
          dist: new Float32Array(n),
          lag: new Float32Array(n),
          dur: dir > 0 ? 560 : 820,
          speed: dir > 0 ? 1 : 560 / 820,
          from: performance.now(),
          landed: false,
          raf: 0
        };
        for (k = 0; k < n; k++) {
          id = list[k];
          dx = F.tx[id] - W.cx;
          dy = F.ty[id] - W.cy;
          d = Math.sqrt(dx * dx + dy * dy);
          W.ux[k] = d ? dx / d : 1;
          W.uy[k] = d ? dy / d : 0;
          W.dist[k] = d;
          W.lag[k] = unit(k * 0.61 + game * 3.7);
        }
        stopLock();
        if (warp && warp.raf) cancelAnimationFrame(warp.raf);
        warp = W;
        setMarkText(dir > 0 ? NAMES[game + 1] : NAMES[slide]);
        if (dir < 0) setSlideFade(slide, 0);
        setFxAlpha(1);
        W.raf = requestAnimationFrame(warpFrame);
      }

      function endReturn() {
        var W = warp;
        if (!W || W.dir > 0) return;
        if (W.raf) cancelAnimationFrame(W.raf);
        warp = null;
        setSlideFade(W.slide, 1);
        clearFx();
      }

      function readReturn() {
        var ref = document.referrer || '';
        var type = '';
        var saved = null;
        var m, game, slide;
        try { type = performance.getEntriesByType('navigation')[0].type; } catch (err) {}
        if (type === 'reload') return null;
        try { saved = JSON.parse(sessionStorage.getItem(STORE)); } catch (err) {}
        m = /\/games\/(tetris|snake|star)\//.exec(ref);
        if (m) {
          game = GAMES.indexOf(m[1]);
          slide = saved && saved.game === game ? saved.slide : 0;
        } else if (type === 'back_forward' && saved) {
          game = saved.game;
          slide = saved.slide;
        } else {
          return null;
        }
        if (!(game >= 0 && game < 3) || !(slide === 0 || slide === game + 1)) return null;
        return { slide: slide, game: game };
      }

      function startReturn(info) {
        var k;
        introDone = true;
        markEl.style.opacity = '1';
        mark.target = GAMES[info.game];
        markText.nodeValue = mark.target;
        for (k = 0; k < slides.length; k++) setSlideFade(k, 0);
        deck.scrollTop = info.slide * viewH;
        setBar(info.slide / (slides.length - 1));
        startWarp(-1, info.slide, info.game);
        warmUp();
      }

      function apply() {
        var n = slides.length;
        var p = deck.scrollTop / viewH;
        var start, frac, moving, nameAt, fadeIn, fadeOut, k;
        scheduled = false;
        if (!introDone) {
          if (p < 0.002) return;
          finishBoot();
        }
        if (warp) {
          if (warp.dir < 0 && Math.abs(p - warp.slide) > 0.002) endReturn();
          else return;
        }
        start = p < 0 ? 0 : p | 0;
        if (start > n - 1) start = n - 1;
        frac = p - start;
        moving = motion && frac > 0.02 && frac < 0.98 && start < n - 1 && fields[start] && fields[start + 1];
        if (moving) {
          if (lock.on) stopLock();
          wasMoving = true;
          fadeIn = smoothstep(frac / 0.08);
          fadeOut = smoothstep((frac - 0.92) / 0.08);
          for (k = 0; k < n; k++) setSlideFade(k, k === start ? 1 - fadeIn : k === start + 1 ? fadeOut : 0);
          drawBridge(start, frac);
          setFxAlpha(Math.min(fadeIn, 1 - fadeOut));
          nameAt = frac > 0.55 ? start + 1 : start;
        } else {
          nameAt = frac > 0.5 && start < n - 1 ? start + 1 : start;
          for (k = 0; k < n; k++) setSlideFade(k, !motion || k === nameAt ? 1 : 0);
          if (wasMoving) {
            wasMoving = false;
            lockOn(nameAt);
          } else if (!lock.on) {
            clearFx();
          }
        }
        setMarkText(NAMES[nameAt]);
        setBar(p / (n - 1));
      }

      function requestApply() {
        if (scheduled) return;
        scheduled = true;
        requestAnimationFrame(apply);
      }

      function onResize() {
        resizeTimer = 0;
        if (warp || leaving) return;
        fit();
        stopLock();
        rebuild();
        if (!introDone && fields[0] && fields[0].count) prepBoot();
        else warmUp();
        requestApply();
      }

      function onTap(e) {
        var a = e.target.closest ? e.target.closest('a') : null;
        var p, slide, game;
        if (!a || e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        if (warp || leaving) {
          e.preventDefault();
          return;
        }
        if (!introDone) {
          if (bootUi < 0.6) {
            e.preventDefault();
            return;
          }
          finishBoot();
        }
        if (!motion) return;
        p = deck.scrollTop / viewH;
        slide = Math.round(p);
        if (Math.abs(p - slide) > 0.01 || !fields[slide]) return;
        game = slide === 0 ? Array.prototype.indexOf.call(homeRows, a) : slide - 1;
        if (game < 0) return;
        e.preventDefault();
        try { sessionStorage.setItem(STORE, JSON.stringify({ slide: slide, game: game })); } catch (err) {}
        startWarp(1, slide, game, a.href);
      }

      for (i = 0; i < slides.length; i++) {
        bodies.push(slides[i].querySelector('.rows') || slides[i].querySelector('.stage'));
        aims.push(slides[i].querySelector('.aim'));
        aimAnims.push(null);
        shownFade.push(-1);
      }

      addEventListener('resize', function () {
        if (resizeTimer) clearTimeout(resizeTimer);
        resizeTimer = setTimeout(onResize, 160);
      });
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) return;
        if (!introDone) finishBoot();
        if (warp && warp.dir < 0) endReturn();
      });
      addEventListener('pageshow', function (e) {
        var back = leaving;
        if (!e.persisted || !back) return;
        leaving = null;
        startWarp(-1, back.slide, back.game);
      });
      deck.addEventListener('scroll', requestApply, { passive: true });
      deck.addEventListener('pointerdown', function (e) {
        pointerDown = true;
        dragged = false;
        sx = e.clientX;
        sy = e.clientY;
      });
      deck.addEventListener('pointermove', function (e) {
        if (!pointerDown) return;
        if (Math.abs(e.clientY - sy) > 8 || Math.abs(e.clientX - sx) > 8) dragged = true;
      });
      deck.addEventListener('pointerup', function () { pointerDown = false; });
      deck.addEventListener('pointercancel', function () { pointerDown = false; });
      deck.addEventListener('click', function (e) {
        if (!dragged) return;
        e.preventDefault();
        dragged = false;
      }, true);
      deck.addEventListener('click', onTap);

      fit();
      rebuild();
      if (!motion || !fields[0] || !fields[0].count) {
        finishBoot();
      } else {
        i = readReturn();
        if (i) {
          startReturn(i);
        } else {
          prepBoot();
          bootT0 = performance.now();
          bootRaf = requestAnimationFrame(bootFrame);
        }
      }
      apply();
    })();
  </script>
</body>
</html>
